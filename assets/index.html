<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
<title>Spool Factory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav">
 <button data-tab="home" class="on"><i class="i">&#xf015;</i><span data-t="nav.home"></span></button>
 <button data-tab="control"><i class="i">&#xf1de;</i><span data-t="nav.control"></span></button>
 <button data-tab="stock"><i class="i">&#xf1b2;</i><span data-t="nav.stock"></span></button>
 <button data-tab="nfc"><i class="i">&#xf519;</i><span data-t="nav.nfc"></span></button>
 <button data-tab="settings"><i class="i">&#xf013;</i><span data-t="nav.settings"></span></button>
</nav>
<main>
 <div id="banner"></div>

 <section id="tab-home">
  <div class="grid home-grid">
   <div class="card" id="print-card"></div>
   <div class="card"><h3 data-t="home.filaments"></h3><div class="feeders" id="home-feeders"></div></div>
   <div class="card"><div class="temps" id="home-temps"></div></div>
  </div>
 </section>

 <section id="tab-control" hidden>
  <div class="head"><h1 data-t="ctl.title"></h1><button class="danger" id="estop"><i class="i">&#xf011;</i> <span data-t="ctl.estop"></span></button></div>
  <div class="card" id="ctl-print"></div>
  <div class="card"><h3 data-t="ctl.temps"></h3><div class="ctl-grid" id="ctl-temps"></div><p class="small muted" id="ctl-temps-note"></p></div>
  <div class="card"><h3 data-t="ctl.fans"></h3><div class="ctl-grid" id="ctl-fans"></div></div>
  <div class="card"><h3 data-t="ctl.feeders"></h3><div class="ctl-grid" id="ctl-feeders"></div><p class="small muted" data-t="feed.warning"></p></div>
 </section>

 <section id="tab-stock" hidden>
  <div class="head"><h1 data-t="stock.title"></h1><span class="small muted" id="stock-updated"></span>
   <button id="stock-refresh"><i class="i">&#xf021;</i> <span data-t="common.refresh"></span></button>
   <button class="primary" id="stock-new"><i class="i">&#xf067;</i> <span data-t="stock.new"></span></button></div>
  <input id="search" type="search" data-tp="stock.search" autocomplete="off">
  <div class="filters">
   <select id="f-material"></select><select id="f-vendor"></select><select id="f-location"></select>
   <select id="f-sort"><option value="id" data-t="sort.id"></option><option value="weight" data-t="sort.weight"></option><option value="material" data-t="sort.material"></option><option value="brand" data-t="sort.brand"></option></select>
  </div>
  <div class="row">
   <button class="chip" id="c-archived" data-t="stock.archived"></button>
   <button class="chip" id="c-low" data-t="stock.low"></button>
   <button class="chip" id="c-compact" data-t="stock.compact"></button>
   <button class="chip" id="c-clear" data-t="stock.clear"></button>
   <span class="small muted" id="stock-summary"></span>
  </div>
  <p></p>
  <div class="list" id="stock-list"></div>
 </section>

 <section id="tab-nfc" hidden>
  <div class="head"><h1 data-t="nfc.title"></h1></div>
  <div class="card reader"><i class="i big">&#xf519;</i><div><h2 data-t="nfc.tap"></h2><p class="t2" id="nfc-status"></p><button id="nfc-onoff" hidden data-t="nfc.off"></button></div></div>
  <div id="nfc-result"></div>
  <div class="card"><h3 data-t="nfc.deadline"></h3><div class="row" id="nfc-deadline"></div></div>
 </section>

 <section id="tab-settings" hidden>
  <div class="head"><h1 data-t="set.title"></h1></div>
  <div class="card">
   <h2 data-t="set.printer"></h2>
   <p class="small t2" id="set-conn"></p>
   <label for="s-printer" data-t="set.ip"></label><input id="s-printer" inputmode="url" autocomplete="off">
   <label for="s-spoolman" data-t="set.spoolman"></label><input id="s-spoolman" inputmode="url" autocomplete="off">
   <p class="small muted" data-t="set.spoolman_hint"></p>
   <details><summary class="small t2" data-t="set.keys"></summary>
    <label for="s-printerKey">Moonraker</label><input id="s-printerKey" autocomplete="off">
    <label for="s-spoolKey">Spoolman</label><input id="s-spoolKey" autocomplete="off"></details>
   <label for="s-language" data-t="set.language"></label>
   <select id="s-language"><option value="auto" data-t="set.lang_auto"></option><option value="pt">Português (Brasil)</option><option value="en">English</option></select>
   <div class="row" style="margin-top:14px"><button class="primary" id="s-save" data-t="common.save"></button><button id="s-test" data-t="conn.test"></button><button id="s-rescan" data-t="conn.rescan"></button></div>
   <p class="small" id="s-result"></p>
  </div>
  <div class="card"><div class="row"><h2 class="spacer" data-t="log.title"></h2><button id="s-share" data-t="set.share"></button></div><ul class="log" id="log"></ul></div>
  <div class="card"><h2 data-t="set.about"></h2><p class="t2" id="about"></p><button id="s-firmware" data-t="set.firmware"></button></div>
 </section>
</main>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="i18n-data.js"></script>
<script src="app.js"></script>
</body>
</html>
